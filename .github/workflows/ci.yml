name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.13.0"
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "24"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Check server types
        run: npm run typecheck
      - name: Lint web
        run: npm --prefix web run lint
      - name: Test runtime and adapters
        run: npm test
      - name: Build server and web
        run: npm run build
      - name: Pack npm release
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Verify global installation and Pizza execution
        run: npm run verify:package
      - name: Upload npm package and verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
